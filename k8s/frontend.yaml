# Living Memory frontend — Deployment + Service.
#
# The frontend is stateless and has no backing dependency it must reach before
# serving HTML, so readiness and liveness both point at "/". They remain
# separate probe blocks with different tuning: readiness is quick to pull a pod
# from rotation, liveness is slow to restart it.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: living-memory-frontend
  labels:
    app: living-memory
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: living-memory
      component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: living-memory
        component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: frontend
          image: living-memory-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://living-memory-backend:8000"

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: living-memory-frontend
  labels:
    app: living-memory
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: living-memory
    component: frontend
  ports:
    - name: http
      port: 3000
      targetPort: http
