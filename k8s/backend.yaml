# Living Memory backend — Deployment + Service.
#
# Probe design is the load-bearing decision here.
#
#   livenessProbe  → /health/live   Trivial. No dependencies touched.
#   readinessProbe → /health/ready  Checks seed data + API key config.
#
# They are deliberately DIFFERENT endpoints. If liveness pointed at the
# dependency check, then any dependency slowdown would fail liveness on every
# pod simultaneously and Kubernetes would restart the whole fleet in a loop —
# converting a recoverable degradation into a self-inflicted outage. Readiness
# failing merely removes the pod from Service endpoints; it recovers on its own
# when the dependency returns, with no restart.
#
# startupProbe exists so a slow first boot (seed data load) does not get killed
# by liveness before the app has had a chance to come up. While a startupProbe
# is active, liveness and readiness are suspended.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: living-memory-backend
  labels:
    app: living-memory
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: living-memory
      component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # never drop below current capacity during a rollout
  template:
    metadata:
      labels:
        app: living-memory
        component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: living-memory-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: living-memory-secrets
                  key: anthropic-api-key
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: living-memory-secrets
                  key: elevenlabs-api-key
                  optional: true
            - name: AVIATIONSTACK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: living-memory-secrets
                  key: aviationstack-api-key
                  optional: true

          # ── Startup: give the process up to 60s (12 × 5s) to boot ──────────
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3

          # ── Liveness: is the process wedged? Restart is the right cure. ────
          # Trivial endpoint, generous threshold — restarting is destructive so
          # we require sustained failure, not a single blip.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          # ── Readiness: can this pod serve? Pulled from Service if not. ─────
          # Tighter and more sensitive than liveness on purpose: removing a pod
          # from rotation is cheap and instantly reversible.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
            successThreshold: 1

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          volumeMounts:
            - name: seed-data
              mountPath: /data
      volumes:
        - name: seed-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: living-memory-backend
  labels:
    app: living-memory
    component: backend
spec:
  type: ClusterIP
  selector:
    app: living-memory
    component: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
